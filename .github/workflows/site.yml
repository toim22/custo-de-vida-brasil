name: Coletar dados e publicar o site

on:
  schedule:
    - cron: "0 8,20 * * *"   # todo dia, 5h e 17h de Brasília (UTC-3)
    - cron: "30 13-21 * * 1-5"  # dias úteis, de hora em hora no pregão: só atualiza dólar e Bolsa e publica
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  coletar:
    # a coleta completa não roda no push nem na atualização de hora em hora da Bolsa
    if: github.event_name != 'push' && github.event.schedule != '30 13-21 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      falhou: ${{ steps.coleta.outcome == 'failure' || steps.luzagua.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletores/requirements.txt
      - run: pip install -r coletores/requirements.txt
      - name: Diagnóstico das fontes
        working-directory: coletores
        continue-on-error: true
        timeout-minutes: 15
        run: python -u descobrir.py
      - name: Coletar
        id: coleta
        working-directory: coletores
        continue-on-error: true
        timeout-minutes: 40
        run: python -u rodar.py
      - name: Coletar luz e água
        id: luzagua
        working-directory: coletores
        continue-on-error: true
        timeout-minutes: 20
        run: python -u luz_agua.py
      - name: Radar de impostos (projetos na Câmara e no Senado e notícias)
        # não marca a coleta como falha: se der erro, fica o radar salvo da última vez
        working-directory: coletores
        continue-on-error: true
        timeout-minutes: 10
        run: python -u impostos_radar.py
      - name: Salvar dados no repositório
        run: |
          git config user.name "robo-coleta"
          git config user.email "robo-coleta@users.noreply.github.com"
          git add dados descobertas
          git diff --cached --quiet || git commit -m "Coleta automática $(date -u +%Y-%m-%d)"
          # se alguém mexeu no main durante a coleta (ex.: um merge), junta antes de enviar
          # em conflito nos arquivos de dados, fica a versão desta coleta (a mais nova)
          git pull --rebase -X theirs origin main
          git push

  publicar:
    needs: coletar
    if: always() && needs.coletar.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preço mais novo do dólar e da Bolsa (não grava no repositório; se falhar, fica o último dado salvo)
        continue-on-error: true
        timeout-minutes: 5
        working-directory: coletores
        run: |
          pip install requests==2.32.3
          python -u mercado.py
      - name: Montar a pasta do site
        run: |
          mkdir _site
          cp -r *.html CNAME assets dados config _site/
          touch _site/.nojekyll
          # versão nos arquivos do site: o navegador baixa o CSS/JS/logo novos logo após cada publicação
          v=${GITHUB_SHA::8}
          sed -i "s#assets/estilo.css\"#assets/estilo.css?v=$v\"#; s#assets/app.js\"#assets/app.js?v=$v\"#" _site/*.html
          sed -i "s#assets/logo.png#assets/logo.png?v=$v#" _site/assets/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  avisar:
    needs: [coletar, publicar]
    if: always() && needs.coletar.outputs.falhou == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Alguma fonte falhou na coleta. O site continua com o último dado bom. Veja o passo 'Coletar' do job 'coletar'."
          exit 1
