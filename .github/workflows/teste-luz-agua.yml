# TEMPORÁRIO: testa o coletor de luz e água neste branch. Apagar antes do merge.
name: Teste luz e água
on:
  push:
    branches: [claude/project-thread-3vvy46]
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r coletores/requirements.txt
      - name: SNIS (tarifas de água por estado)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          curl -sSL -m 300 -o /tmp/snis.pdf https://tratabrasil.org.br/wp-content/uploads/2024/04/DIAGNOSTICO_TEMATICO_VISAO_GERAL_AE_SNIS_2023.pdf
          ls -la /tmp/snis.pdf
          pdftotext -layout /tmp/snis.pdf /tmp/snis.txt
          grep -n -i "tarifa m" /tmp/snis.txt | head -80
          mkdir -p descobertas && cp /tmp/snis.txt descobertas/snis_2023_visao_geral.txt
      - name: Coletar luz e água
        working-directory: coletores
        continue-on-error: true
        run: python -u luz_agua.py
      - name: Salvar
        run: |
          git config user.name "robo-coleta"
          git config user.email "robo-coleta@users.noreply.github.com"
          for f in dados/energia.json dados/agua.json dados/ipca_luz_agua.json descobertas/aneel_* descobertas/snis_*; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "Teste: coleta de luz e água"
          git push
