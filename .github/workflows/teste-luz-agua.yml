# TEMPORÁRIO: testa o coletor de luz e água neste branch. Apagar antes do merge.
name: Teste luz e água
on:
  push:
    branches: [claude/project-thread-3vvy46]
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r coletores/requirements.txt
      - name: Diagnóstico ANEEL
        continue-on-error: true
        run: |
          getent hosts dadosabertos.aneel.gov.br || true
          for u in https://dadosabertos.aneel.gov.br/api/3/action/package_show?id=bandeiras-tarifarias http://dadosabertos.aneel.gov.br/ https://www.aneel.gov.br/ https://www.gov.br/aneel/pt-br https://portalrelatorios.aneel.gov.br/ https://git.aneel.gov.br/ ; do
            curl -s -o /dev/null -m 90 -w "%{http_code} %{time_total}s $u\n" "$u" || echo "falhou $u"
          done
      - name: Coletar luz e água
        working-directory: coletores
        continue-on-error: true
        run: python -u luz_agua.py
      - name: Salvar
        run: |
          git config user.name "robo-coleta"
          git config user.email "robo-coleta@users.noreply.github.com"
          for f in dados/energia.json dados/agua.json dados/ipca_luz_agua.json descobertas/aneel_*; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "Teste: coleta de luz e água"
          git push
