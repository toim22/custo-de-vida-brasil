# TEMPORÁRIO: testa o coletor de luz e água neste branch. Apagar antes do merge.
name: Teste luz e água
on:
  push:
    branches: [claude/project-thread-3vvy46]
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r coletores/requirements.txt
      - name: SNIS (tabelas por prestador)
        continue-on-error: true
        run: |
          mkdir -p /tmp/snis descobertas
          cd /tmp/snis
          for ano in 2022; do
            for base in https://www.gov.br/cidades/pt-br/acesso-a-informacao/acoes-e-programas/saneamento/snis/produtos-do-snis/diagnosticos https://www.gov.br/cidades/pt-br/assuntos/saneamento/snis/produtos-do-snis/diagnosticos http://www.snis.gov.br/downloads/diagnosticos/ae/$ano; do
              u="$base/Planilhas_AE$ano.zip"
              c=$(curl -sSL -m 300 -o p$ano.zip -w "%{http_code}" "$u" || echo erro)
              echo "$c $u $(stat -c %s p$ano.zip 2>/dev/null)"
              if [ "$c" = "200" ] && unzip -tq p$ano.zip >/dev/null 2>&1; then unzip -o -q p$ano.zip -d ae$ano; break; fi
            done
          done
          for z in /tmp/snis/ae2022/*/Planilha_Resumo_Estado_2022.zip /tmp/snis/ae2022/*/Planilha_AE2022_Completa_Regionais.zip; do mkdir -p /tmp/snis/x/$(basename $z .zip); unzip -o -q "$z" -d /tmp/snis/x/$(basename $z .zip); done
          find /tmp/snis/x -type f | head -50
          python3 - <<'PY' > $GITHUB_WORKSPACE/descobertas/snis_tarifas.txt
          import glob, pandas as pd
          for f in sorted(glob.glob('/tmp/snis/x/**/*.*', recursive=True)):
              if f.lower().endswith('.csv'):
                  print('== CSV', f); print(open(f, encoding='latin-1').read()[:3000]); continue
              try:
                  xl = pd.ExcelFile(f)
              except Exception as e:
                  print('ERRO', f, e); continue
              for sh in xl.sheet_names:
                  df = xl.parse(sh, header=None)
                  txt = df.astype(str)
                  hit = txt.apply(lambda c: c.str.contains('IN005|IN006', regex=True)).any().any()
                  print('==', f, sh, df.shape, 'IN005' if hit else '')
                  if hit:
                      cols = [c for c in df.columns if txt[c].str.contains('IN00[456]|Sigla|UF|Prestador|Estado|Abrang', regex=True).any()]
                      keep = df[cols] if cols else df
                      print(keep.to_csv(sep='\t', index=False)[:80000])
          PY
          wc -c $GITHUB_WORKSPACE/descobertas/snis_tarifas.txt
      - name: Coletar luz e água
        working-directory: coletores
        continue-on-error: true
        run: python -u luz_agua.py
      - name: Salvar
        run: |
          git config user.name "robo-coleta"
          git config user.email "robo-coleta@users.noreply.github.com"
          for f in dados/energia.json dados/agua.json dados/ipca_luz_agua.json descobertas/aneel_* descobertas/snis_*; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "Teste: coleta de luz e água"
          git push
