<!doctype html>
<html lang="pt-BR" data-repo="toim22/custo-de-vida-brasil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tudo Caro · quanto custa viver no Brasil hoje</title>
<meta name="description" content="Preço da cesta básica, gasolina, gás de cozinha, churrasco e o que o salário mínimo compra, atualizado toda semana desde 2023, por estado.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Tudo Caro">
<meta property="og:url" content="https://tudocaro.com.br/">
<meta property="og:image" content="https://tudocaro.com.br/assets/compartilhar.png">
<link rel="canonical" href="https://tudocaro.com.br/">
<meta property="og:description" content="Quanto custa viver no Brasil hoje? Cesta básica, combustível, gás, churrasco e salário mínimo, por estado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/estilo.css?v=20261118">
<script src="assets/app.js?v=20261118" defer></script>
</head>
<body>
<main class="wrap">

  <section class="bloco">
    <span class="eyebrow" id="atualizado">Atualizado todos os dias</span>
    <h1>Quanto custa viver no Brasil hoje?</h1>
    <div class="filtros">
      <label class="visually-hidden" for="local">Onde você mora</label>
      <select id="local"></select>
    </div>
  </section>

  <section class="painel" id="painel" aria-label="Resumo"></section>

  <div class="anuncio" role="complementary" aria-label="Publicidade"><div><b>Publicidade</b>Espaço para parceiros</div></div>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var C = window.CVB;
  Promise.all([C.carregar("combustiveis"), C.carregar("cesta"), C.carregar("salario"), C.carregar("churrasco"), C.config("tanque"), C.carregar("aumentos-impostos"), C.carregar("aluguel")]).then(function (r) {
    var comb = r[0], cesta = r[1], sal = r[2], ch = r[3], tanque = r[4], imp = r[5], al = r[6];
    var litrosTanque = (tanque && tanque.litros) || 49;
    var sel = document.getElementById("local");
    var locais = comb ? Object.keys(comb.series) : ["BR"];
    C.seletorLocal(sel, locais, C.lembrar("local") || "BR");
    sel.addEventListener("change", function () { C.lembrar("local", sel.value); desenhar(); });

    function cestaDo(local) {
      if (!cesta || !cesta.capitais) return null;
      if (cesta.capitais[local]) return { nome: cesta.capitais[local].nome, total: cesta.capitais[local].total };
      var agg = cesta.agregados && cesta.agregados[local];
      if (agg) return { nome: "média " + (local === "BR" ? "das capitais" : "das capitais do " + C.nomeLocal(local)), total: agg.total };
      return null;
    }

    // selo dentro da etiqueta amarela: subiu (vermelho) ou desceu (verde); no salário é o contrário
    function selo(dif, texto, bomSubir) {
      if (dif === null || dif === undefined || isNaN(dif)) return "";
      var cls = C.classe(dif, bomSubir);
      return '<span class="selo-var ' + cls + '">' + (cls === "igual" ? "= " : dif > 0 ? "▲ " : "▼ ") + texto + "</span>";
    }
    function txtPct(v) { return Math.abs(v).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%"; }

    function card(o) {
      return '<a class="card' + (o.destaque ? " destaque" : "") + '" href="' + o.href + '">' +
        '<span class="t">' + o.titulo + "</span>" +
        (o.valor ? '<span class="tag"><span class="lbl">' + o.rotulo + '</span><span class="val">' + o.valor + "</span>" + (o.selo || "") + "</span>" : "") +
        (o.corpo || "") + (o.linhas || []).map(function (l) { return '<span class="linha">' + l + "</span>"; }).join("") + (o.depois || "") +
        '<span class="ir">' + o.ir + " →</span></a>";
    }

    function desenhar() {
      var local = sel.value;
      var cards = [];
      var minimo = sal && C.ultimo(sal.serie) ? C.ultimo(sal.serie)[1] : null;
      var sc = comb && (comb.series[local] || comb.series.BR);
      var localComb = comb && comb.series[local] ? local : "BR";

      // Cesta básica
      var cb = cestaDo(local) || cestaDo("BR");
      if (cb && C.ultimo(cb.total)) {
        var u = C.ultimo(cb.total), a = C.anterior(cb.total);
        cards.push({ href: "cesta.html", destaque: true, titulo: "Cesta básica · DIEESE · " + cb.nome, rotulo: C.data(u[0]), valor: C.brl(u[1], 2),
          selo: a ? selo((u[1] / a[1] - 1) * 100, txtPct((u[1] / a[1] - 1) * 100) + " no mês") : "",
          corpo: C.mini(cb.total),
          linhas: [C.variacao(C.variacao12(cb.total)) + " em 12 meses"],
          ir: "Ver item por item" });
      } else cards.push({ href: "cesta.html", destaque: true, titulo: "Cesta básica · DIEESE", linhas: ["Entra na próxima coleta mensal."], ir: "Ver a cesta" });

      // Gasolina (com etanol e diesel numa linha)
      if (sc && C.ultimo(sc.gasolina)) {
        var g = sc.gasolina, ug = C.ultimo(g), ag = C.anterior(g);
        var outros = ["etanol", "diesel"].filter(function (p) { return C.ultimo(sc[p]); }).map(function (p) {
          var x = C.ultimo(sc[p]), y = C.anterior(sc[p]);
          return '<span class="nw">' + comb.produtos[p].nome.replace(" S10", "") + ' <b class="mono">' + C.brl(x[1], 2) + "</b> " + C.seta(x[1], y && y[1], function (v) { return C.brl(v, 2); }) + "</span>";
        });
        cards.push({ href: "combustiveis.html#gasolina", titulo: "Gasolina · " + C.nomeLocal(localComb), rotulo: "litro · semana até " + C.data(ug[0]), valor: C.brl(ug[1], 2),
          selo: ag ? selo(Math.abs(ug[1] - ag[1]) < 0.005 ? 0 : ug[1] - ag[1], C.brl(Math.abs(ug[1] - ag[1]), 2) + " na semana") : "",
          corpo: C.mini(g, 26), linhas: [C.variacao(C.variacao12(g)) + " em 12 meses"].concat(outros.length ? [outros.join(" · ")] : []),
          ir: "Ver por estado e quanto é imposto" });
      }
      // Gás de cozinha
      if (sc && C.ultimo(sc.glp)) {
        var b = sc.glp, ub = C.ultimo(b), ab = C.anterior(b);
        cards.push({ href: "combustiveis.html#glp", titulo: "Gás de cozinha · " + C.nomeLocal(localComb), rotulo: "botijão de 13 kg", valor: C.brl(ub[1], 2),
          selo: ab ? selo(Math.abs(ub[1] - ab[1]) < 0.005 ? 0 : ub[1] - ab[1], C.brl(Math.abs(ub[1] - ab[1]), 2) + " na semana") : "",
          corpo: C.mini(b, 26), linhas: [C.variacao(C.variacao12(b)) + " em 12 meses"],
          ir: "Ver o gás por estado" });
      }
      // Churrasco
      if (ch && ch.total) {
        var t = ch.total[local] || ch.total.BR, uc = C.ultimo(t);
        if (uc) cards.push({ href: "churrasco.html", titulo: "Churrasco pra 6 · " + C.nomeLocal(ch.total[local] ? local : "BR"), rotulo: "6 pessoas · " + C.data(uc[0]), valor: C.brl(uc[1], 0),
          selo: C.anterior(t) ? selo((uc[1] / C.anterior(t)[1] - 1) * 100, txtPct((uc[1] / C.anterior(t)[1] - 1) * 100) + " no mês") : "",
          corpo: C.mini(t), linhas: [C.brl(uc[1] / 6, 2) + " por pessoa · " + C.variacao(C.variacao12(t)) + " em 12 meses"], ir: "Ver a lista" });
      }
      // Salário mínimo e o que ele compra (no salário, subir é bom: verde)
      if (sal && C.ultimo(sal.serie)) {
        var ss = sal.serie.map(function (p) { return [p[0], p[1]]; }), us = C.ultimo(ss);
        var itens = [];
        if (cb && C.ultimo(cb.total)) itens.push(["Cestas básicas", C.numero(minimo / C.ultimo(cb.total)[1], 1)]);
        if (sc && C.ultimo(sc.gasolina)) itens.push(["Tanques de gasolina (" + litrosTanque + " L)", C.numero(minimo / (C.ultimo(sc.gasolina)[1] * litrosTanque), 1)]);
        if (sc && C.ultimo(sc.glp)) itens.push(["Botijões de gás", C.numero(minimo / C.ultimo(sc.glp)[1], 0)]);
        if (ch && ch.total && C.ultimo(ch.total[local] || ch.total.BR)) itens.push(["Churrascos pra 6", C.numero(minimo / C.ultimo(ch.total[local] || ch.total.BR)[1], 1)]);
        cards.push({ href: "trabalho.html", titulo: "Salário mínimo", rotulo: "por mês · " + C.data(us[0]), valor: C.brl(us[1], 0),
          selo: C.variacao12(ss) !== null ? selo(C.variacao12(ss), txtPct(C.variacao12(ss)) + " em 12 meses", true) : "",
          linhas: ["Com ele dá para comprar:"],
          corpo: "", depois: itens.length ? '<ul class="lista">' + itens.map(function (i) { return "<li><span>" + i[0] + "</span><b>" + i[1] + "</b></li>"; }).join("") + "</ul>" : "",
          ir: "Ver salário e poder de compra" });
      }
      // Aluguel: quanto subiu desde jan/2023 (IPCA aluguel residencial) e preço de um apê de 60 m² (FipeZap)
      if (al && al.ipca && al.ipca.locais) {
        var la = al.ipca.locais[local] ? local : "BR", li = al.ipca.locais[la].indice, ua = C.ultimo(li);
        var v12a = C.variacao12(li), fz = (al.fipezap && al.fipezap.cidades) || {};
        var cidAl = Object.keys(fz).filter(function (n) { return la === "BR" ? fz[n].media : fz[n].uf === la; }).sort(function (a, b) { return (fz[b].capital ? 1 : 0) - (fz[a].capital ? 1 : 0); })[0];
        var linhasAl = [];
        if (cidAl && C.ultimo(fz[cidAl].preco_m2)) linhasAl.push("Apê de 60 m² " + (fz[cidAl].media ? "(média das cidades)" : "em " + cidAl) + ': <b class="mono">' + C.brl(C.ultimo(fz[cidAl].preco_m2)[1] * (al.fipezap.area_referencia_m2 || 60), 0) + "</b>/mês");
        if (ua) cards.push({ href: "aluguel.html", titulo: "Aluguel · " + (la === "BR" ? "Brasil" : al.ipca.locais[la].area_ibge), rotulo: "subiu desde jan/2023 · até " + C.data(ua[0]),
          valor: C.pct(ua[1] - 100, 1), selo: v12a !== null ? selo(v12a, txtPct(v12a) + " em 12 meses") : "", corpo: C.mini(li), linhas: linhasAl, ir: "Ver o aluguel por região" });
      }
      // Aumentos de impostos desde o 2º turno
      if (imp && imp.itens && imp.itens.length) {
        var recentes = imp.itens.slice().sort(function (a, b) { return a.data < b.data ? 1 : -1; }).slice(0, 4);
        cards.push({ href: "aumentos-de-impostos.html", destaque: true, titulo: "Aumentos de impostos desde a eleição",
          corpo: '<span class="v sobe">▲ ' + imp.itens.length + " medidas</span>",
          linhas: ["Mais recentes:"],
          depois: '<ul class="lista">' + recentes.map(function (i) { return '<li><span>' + i.titulo + '</span><b class="muted">' + C.data(i.data) + "</b></li>"; }).join("") + "</ul>",
          ir: "Ver cada aumento" });
      }
      document.getElementById("painel").innerHTML = cards.map(card).join("");
      var ult = sc && C.ultimo(sc.gasolina);
      document.getElementById("atualizado").textContent = ult ? "Atualizado todos os dias · combustível: semana até " + C.data(ult[0]) : "Atualizado todos os dias";
    }
    desenhar();
  });
});
</script>
</body>
</html>
